# Example server block for a site hosted at the domain root.
# Copy the CONTENTS of dist/ to /var/www/secublu before enabling this config.
server {
    listen 80;
    server_name _;
    root /var/www/secublu;
    index index.html;

    # Missing assets should return 404, rather than HTML.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router uses browser history. Direct visits and reloads need this fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
